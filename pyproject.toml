[project]
name = "inf_201_deliverable_3"
version = "0.1.0"
description = "Simple battle simulator"
readme = "README.md"
authors = [
    { name = "Kevin", email = "kevhonn02@gmail.com" },
    { name = "Herman Nordstrand", email = "?" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
project = "game.run:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", # PEP8 rules
    "F",               # undefined variables and imports
    "I",               # sorting of imports
    "B",               # bugs
    "UP",              # python syntax
    "SIM",             # simplifications
    "RUF",             # Ruff-spesific rules
]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.uv.build-backend]
module-name = "game"
